[project]
name = "bloodline"
version = "0.1.0"
description = "Bloodline is a python package used for row-level data lineage"
readme = "README.md"
authors = [
  {name = "Alexis Cruveiller", email = "alexis@carbonfact.com"},
  {name = "Max Halford", email = "max@carbonfact.com"},
]
maintainers = [
  {name = "Alexis Cruveiller", email = "alexis@carbonfact.com"},
  {name = "Max Halford", email = "max@carbonfact.com"},
]
license = {text = "MIT"}
dependencies = [
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "loguru>=0.7.2",
]
requires-python = ">= 3.10"


[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
default-groups = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pandas>=1.5.0",
    "rich>=12.0.0",
]
