files: bloodline
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version
    rev: 0.9.11
    hooks:
      # Check lockfile is up to date
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.14.6
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format
        files: ^bloodline
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: ty check .
        language: python
